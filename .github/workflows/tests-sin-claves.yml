# CI: pruebas automatizadas sin claves (solo stdlib) — La Centralita.
#
# Corre las suites tests/test_sin_claves.py (22 tests),
# tests/test_servidor_limites.py (8 tests),
# tests/test_validacion_entrada.py (11 tests),
# tests/test_cabeceras_seguridad.py (8 tests),
# tests/test_tamano_cuerpo.py (9 tests) y
# tests/test_paginacion_historial.py (12 tests),
# tests/test_limite_eventos_llamada.py (12 tests) y
# tests/test_limite_conexiones_monitor.py (7 tests) — 89 tests en cada
# push y en cada pull request. Sin LIVEKIT_URL, sin DEEPGRAM_API_KEY, sin
# DEEPSEEK_API_KEY, sin red y sin dependencias extra: solo Python 3.12 de
# la librería estándar. Las suites cubren Config.validate(), extract_lead()
# con HTTP simulado, prompts, modo demo del panel, ausencia de secretos en
# los archivos servidos, los topes de memoria del servidor (historiales y
# registro de rate-limit del token público), la validación de tamaño de
# entrada (eventos y nombres de token), las cabeceras de seguridad del
# servidor (nosniff, SAMEORIGIN, no-referrer, no-store en /api/* y /ws/*),
# el límite de tamaño del cuerpo HTTP (413 antes de parsear el JSON),
# la paginación del historial de /api/calls y /api/leads (50 más
# recientes por defecto, limit 1–100, offset desde 0), el rate-limit
# de /api/call-event (60 eventos por minuto y por IP, 429 al pasarlo;
# las inválidas y las sin token no consumen cuota) y el límite de
# conexiones WebSocket simultáneas en /ws/monitor (máximo 50, cierre 1013).
#
# No gasta nada: repositorio público, minutos de Actions gratuitos.
# Rama: feature/ci-tests-sin-claves (ciclo de mejora continua, 12/11/2026;
# continúa la suite sin claves del 11/11 en feature/tests-centralita).
# Ampliada el 13/11/2026 (feature/limites-memoria-servidor) con la suite
# de límites de memoria del servidor.
# Ampliada el 14/11/2026 (feature/validacion-entrada-servidor) con la
# suite de validación de tamaño de entrada.
# Ampliada el 15/11/2026 (feature/cabeceras-seguridad-servidor) con la
# suite de cabeceras de seguridad del servidor.
# Ampliada el 16/11/2026 (feature/limite-cuerpo-peticion) con la suite
# de límite de tamaño del cuerpo HTTP.
# Ampliada el 17/11/2026 (feature/paginacion-historial) con la suite
# de paginación del historial de /api/calls y /api/leads.
# Ampliada el 18/11/2026 (feature/limite-eventos-llamada) con la suite
# de rate-limit de /api/call-event.
# Ampliada el 24/11/2026 (feature/limite-conexiones-monitor) con la suite
# de límite de conexiones WebSocket en el monitor.
name: tests-sin-claves

on:
  push:
  pull_request:

jobs:
  tests-sin-claves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Suites sin claves (stdlib, sin red)
        run: python3 -m unittest tests.test_sin_claves tests.test_servidor_limites tests.test_validacion_entrada tests.test_cabeceras_seguridad tests.test_tamano_cuerpo tests.test_paginacion_historial tests.test_limite_eventos_llamada tests.test_limite_conexiones_monitor -v
