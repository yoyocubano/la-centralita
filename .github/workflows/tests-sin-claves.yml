# CI: pruebas automatizadas sin claves (solo stdlib) — La Centralita.
#
# Corre las suites tests/test_sin_claves.py (22 tests) y
# tests/test_servidor_limites.py (8 tests) en cada push y en cada pull
# request. Sin LIVEKIT_URL, sin DEEPGRAM_API_KEY, sin DEEPSEEK_API_KEY,
# sin red y sin dependencias extra: solo Python 3.12 de la librería
# estándar. Las suites cubren Config.validate(), extract_lead() con HTTP
# simulado, prompts, modo demo del panel, ausencia de secretos en los
# archivos servidos, y los topes de memoria del servidor (historiales y
# registro de rate-limit del token público).
#
# No gasta nada: repositorio público, minutos de Actions gratuitos.
# Rama: feature/ci-tests-sin-claves (ciclo de mejora continua, 12/11/2026;
# continúa la suite sin claves del 11/11 en feature/tests-centralita).
# Ampliada el 13/11/2026 (feature/limites-memoria-servidor) con la suite
# de límites de memoria del servidor.
name: tests-sin-claves

on:
  push:
  pull_request:

jobs:
  tests-sin-claves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Suites sin claves (stdlib, sin red)
        run: python3 -m unittest tests.test_sin_claves tests.test_servidor_limites -v
