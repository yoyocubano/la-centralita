<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Centralita — Página de prueba</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 3rem auto; padding: 0 1rem; }
  button { font-size: 1.1rem; padding: .7rem 1.4rem; cursor: pointer; }
  #log { background: #111; color: #0f0; padding: 1rem; height: 220px; overflow-y: auto; white-space: pre-wrap; }
  input { width: 100%; margin: .3rem 0; padding: .5rem; }
</style>
</head>
<body>
<h1>📞 La Centralita — prueba de voz</h1>
<p>Pega la URL de LiveKit y el token generado con <code>agent/make_token.py</code>:</p>
<input id="url" placeholder="wss://tu-proyecto.livekit.cloud">
<input id="token" placeholder="token JWT">
<p>
  <button id="call">Llamar</button>
  <button id="hangup" disabled>Colgar</button>
</p>
<h3>Estado</h3>
<div id="log"></div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script>
const log = (m) => { const el = document.getElementById('log'); el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; };
let room = null;

async function autoFetchToken() {
  const tokenInput = document.getElementById('token');
  const urlInput = document.getElementById('url');
  if (tokenInput.value.trim() && urlInput.value.trim()) return;
  try {
    log("Obteniendo credenciales WebRTC seguras desde /api/token...");
    let op = sessionStorage.getItem('centralita_operator_token') || '';
    if (!op) {
      op = (prompt('Token de operador (CENTRALITA_AUTH_TOKEN):') || '').trim();
      if (!op) throw new Error('sin token de operador');
      sessionStorage.setItem('centralita_operator_token', op);
    }
    const res = await fetch('/api/token?room=centralita-test', {
      headers: { 'Authorization': 'Bearer ' + op }
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    urlInput.value = data.url;
    tokenInput.value = data.token;
    log("Token generado automáticamente para sala: " + data.room);
  } catch (e) {
    log("Aviso: No se pudo auto-obtener token (" + e.message + "). Ingrésalo manualmente.");
  }
}

document.addEventListener('DOMContentLoaded', autoFetchToken);

document.getElementById('call').onclick = async () => {
  let url = document.getElementById('url').value.trim();
  let token = document.getElementById('token').value.trim();
  if (!url || !token) {
    await autoFetchToken();
    url = document.getElementById('url').value.trim();
    token = document.getElementById('token').value.trim();
  }
  if (!url || !token) { log("Falta URL o token."); return; }
  try {
    room = new LivekitClient.Room({
      adaptiveStream: true,
      dynacast: true
    });
    window.room = room;
    room.on(LivekitClient.RoomEvent.ParticipantConnected, (p) => {
      log("👤 Entró a la sala: " + p.identity + " (" + (p.name || 'Agente') + ")");
    });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, (track, pub, participant) => {
      if (track.kind === LivekitClient.Track.Kind.Audio) {
        const audio = track.attach();
        document.body.appendChild(audio);
        log("🔊 Audio recibido de " + participant.identity + " (" + track.sid + ")");
      }
    });
    room.on(LivekitClient.RoomEvent.Disconnected, () => log("Llamada terminada."));
    log("Conectando a LiveKit Cloud...");
    await room.connect(url, token);
    log("✅ Señalización establecida. Negociando canales de audio WebRTC...");
    await new Promise(r => setTimeout(r, 1200));
    try {
      await room.localParticipant.setMicrophoneEnabled(true);
      log("🎙️ Micrófono activo. ¡Habla con el agente!");
    } catch (micErr) {
      log("⚠️ Audio local no publicado: " + micErr.message + " (Escucha el audio del agente)");
    }
    document.getElementById('call').disabled = true;
    document.getElementById('hangup').disabled = false;
  } catch (err) {
    log("❌ Error al conectar llamada: " + err.message);
  }
};

document.getElementById('hangup').onclick = async () => {
  if (room) await room.disconnect();
  document.getElementById('call').disabled = false;
  document.getElementById('hangup').disabled = true;
};
</script>
</body>
</html>
